name: oidc-claims

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  print-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Request OIDC token and print claims
        run: |
          IDTOKEN=$(curl -sSf \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://MyAudience" \
            | jq -r '.value')

          echo "$IDTOKEN" \
            | cut -d '.' -f2 \
            | base64 -d 2>/dev/null \
            | jq .
