name: pull_request
on:
  pull_request:
    types:
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - opened
      - edited
      - closed
      - reopened
      - synchronize
      - converted_to_draft
      - locked
      - unlocked
      - enqueued
      - dequeued
      - milestoned
      - demilestoned
      - ready_for_review
      - review_requested
      - review_request_removed
      - auto_merge_enabled
      - auto_merge_disabled
    
permissions: {}

jobs:
  one:
    cache-mode: write
    runs-on: ubuntu-22.04
    steps:
      - name: Create Markdown file on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          printf '# Cache test\n\nThis is a cached Markdown file.\n' > cache-test.md

      - name: Verify cached file
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "Cache hit: $CACHE_HIT"
          test -s cache-test.md
          cat cache-test.md

      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - run: echo "${{ secrets.FLAG }}"
      - uses: actions/checkout@v7
      - run: cat README.md
