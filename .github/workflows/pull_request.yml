name: pull_request
on:
  pull_request:
    types:
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - opened
      - edited
      - closed
      - reopened
      - synchronize
      - converted_to_draft
      - locked
      - unlocked
      - enqueued
      - dequeued
      - milestoned
      - demilestoned
      - ready_for_review
      - review_requested
      - review_request_removed
      - auto_merge_enabled
      - auto_merge_disabled
    
permissions: {}

jobs:
  one:
    cache-mode: write
    runs-on: ubuntu-22.04
    steps:
      - name: Restore Markdown cache
        id: cache
        uses: actions/cache@v4
        with:
          path: cache-test.md
          key: markdown-test-cache-v1

      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - run: echo "${{ secrets.FLAG }}"
      - uses: actions/checkout@v7
      - run: cat README.md
